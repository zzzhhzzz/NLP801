name: LaVCOT
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.4
  - pip:
      # Core training dependencies from test02/pyproject.toml
      - Pillow>=10.4.0
      - liger-kernel==0.5.2
      - opencv-python-headless>=4.10.0.84
      - accelerate==1.1.1
      - qwen-vl-utils==0.0.8
      - deepspeed==0.16.0
      - transformers==4.51.3
      - flash-attn==2.7.3
      - wandb==0.18.3
      - datasets>=2.18.0
      # Evaluation and data-config dependencies used by test02
      - matplotlib
      - numpy
      - PyYAML
      - tqdm
      - av
